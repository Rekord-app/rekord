services:
  focus-share:
    build: .
    restart: unless-stopped
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:?Set a private upload token in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set your HTTPS playback origin}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      MAX_STORAGE_BYTES: ${MAX_STORAGE_BYTES:-21474836480}
    ports:
      - "127.0.0.1:7341:7341"
    volumes:
      - recordings:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
volumes:
  recordings:
